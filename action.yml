name: 'Loopwright Taskpack Action'
description:
  'Run the Loopwright declarative taskpack cycle for a target repository: qualify the deployment host,'
  ' load .loopwright/taskpack.yaml, compile the trusted registry and controller configuration outside the'
  ' checkout, and invoke the controller cycle through an optional delegate.'
branding:
  icon: 'refresh-cw'
  color: 'purple'

# This file lives at the repository root alongside `.github/workflows/`:
# `.github/workflows/` must maintain least-privilege permissions and remain strictly protected against untrusted taskpack and sandbox writes.

inputs:
  taskpack-path:
    description: 'Path to the declarative taskpack manifest inside the target repository.'
    required: false
    default: '.loopwright/taskpack.yaml'
  mode:
    description: "Cycle mode: 'candidate' or 'no-change'."
    required: false
    default: 'candidate'
  event-name:
    description: 'Triggering event name (schedule, workflow_dispatch, repository_dispatch, release, issue_comment, pull_request_review).'
    required: false
    default: 'workflow_dispatch'
  event-path:
    description: 'Path to the event payload JSON file (github.event_path).'
    required: false
  run-root:
    description: 'Trusted root directory for compiled artifacts; must live outside the repository checkout.'
    required: false
  run-id:
    description: 'Stable identifier for this run.'
    required: false
  storage-profile:
    description: "Deployment storage profile: 'actions-basic' or 'durable'."
    required: false
    default: 'actions-basic'
  provider:
    description: 'Token-authenticated Pi model provider for the author role (e.g. zai, zai-coding-cn, anthropic, openai, openrouter, deepseek).'
    required: false
  model:
    description: 'Pi model identifier for the author role (e.g. glm-5.3, claude-sonnet-4-6, gpt-5.4).'
    required: false
  thinking:
    description: 'Pi thinking level (off, minimal, low, medium, high, xhigh, max).'
    required: false
  api:
    description: 'Optional Pi wire API override (anthropic-messages, openai-completions, openai-responses).'
    required: false
  base-url:
    description: 'Optional HTTPS base URL override for custom or proxy Pi model endpoints.'
    required: false
  provider-token-env:
    description: 'Environment variable name carrying the provider API token (defaults to standard Pi variable or LOOPWRIGHT_PROVIDER_TOKEN).'
    required: false
  models-json:
    description: 'Optional path to a trusted Pi models.json file defining custom compatible providers or model overrides.'
    required: false
  allow-custom-base-url:
    description: "Permit spec.models[].baseUrl from .loopwright/taskpack.yaml when 'true'."
    required: false
    default: 'false'
  dry-run:
    description: "Compile without invoking the controller delegate when 'true'."
    required: false
    default: 'false'
  gate-endpoint-url:
    description: 'External verification gate endpoint URL.'
    required: false
  publication-endpoint-url:
    description: 'Managed publication endpoint URL.'
    required: false

outputs:
  result:
    description: 'Structured JSON result of the entrypoint run.'
    value: ${{ steps.loopwright-entrypoint.outputs.result }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js 26
      uses: actions/setup-node@v4
      with:
        node-version: '26'
    - name: Run Loopwright Taskpack Entrypoint
      id: loopwright-entrypoint
      shell: bash
      env:
        INPUT_TASKPACK-PATH: ${{ inputs.taskpack-path }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_EVENT-NAME: ${{ inputs.event-name }}
        INPUT_EVENT-PATH: ${{ inputs.event-path }}
        INPUT_RUN-ROOT: ${{ inputs.run-root }}
        INPUT_RUN-ID: ${{ inputs.run-id }}
        INPUT_STORAGE-PROFILE: ${{ inputs.storage-profile }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_THINKING: ${{ inputs.thinking }}
        INPUT_API: ${{ inputs.api }}
        INPUT_BASE-URL: ${{ inputs.base-url }}
        INPUT_PROVIDER-TOKEN-ENV: ${{ inputs.provider-token-env }}
        INPUT_MODELS-JSON: ${{ inputs.models-json }}
        INPUT_ALLOW-CUSTOM-BASE-URL: ${{ inputs.allow-custom-base-url }}
        INPUT_DRY-RUN: ${{ inputs.dry-run }}
        INPUT_GATE-ENDPOINT-URL: ${{ inputs.gate-endpoint-url }}
        INPUT_PUBLICATION-ENDPOINT-URL: ${{ inputs.publication-endpoint-url }}
      run: |
        if [[ ! -f "${GITHUB_ACTION_PATH}/packages/github-app/dist/action.js" ]]; then
          npm --prefix "${GITHUB_ACTION_PATH}" ci --no-audit --no-fund && npm --prefix "${GITHUB_ACTION_PATH}" run build
        fi
        node "${GITHUB_ACTION_PATH}/packages/github-app/dist/action.js"
