name: Code Review

permissions:
  contents: read
  pull-requests: write

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  review:
    uses: gpustack/.github/.github/workflows/code-review.yml@main
    with:
      llm_url: "${{ vars.CI_GPUSTACK_CODEREVIEW_LLM_URL }}"
      llm_model: "${{ vars.CI_GPUSTACK_CODEREVIEW_LLM_MODEL }}"
      llm_thinking: "${{ vars.CI_GPUSTACK_CODEREVIEW_LLM_THINKING }}"
      llm_reasoning_effort: "${{ vars.CI_GPUSTACK_CODEREVIEW_LLM_REASONING_EFFORT }}"
      llm_temperature: "${{ vars.CI_GPUSTACK_CODEREVIEW_LLM_TEMPERATURE }}"
      llm_top_p: "${{ vars.CI_GPUSTACK_CODEREVIEW_LLM_TOP_P }}"
      llm_thinking_clear: "${{ vars.CI_GPUSTACK_CODEREVIEW_LLM_THINKING_CLEAR }}"
    secrets:
      llm_auth_token: ${{ secrets.CI_GPUSTACK_CODEREVIEW_LLM_AUTH_TOKEN }}
      app_id: ${{ secrets.CI_GPUSTACK_CODEREVIEW_APP_ID }}
      app_private_key: ${{ secrets.CI_GPUSTACK_CODEREVIEW_APP_PRIVATE_KEY }}
