name: Test

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "v*-dev"
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.png"
      - "**.svg"
  pull_request:
    branches:
      - main
      - "v*-dev"
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.png"
      - "**.svg"

jobs:
  unit:
    name: unit (${{ matrix.os }}, ${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: '1/3'
            args: '--shard 1/3'
          - os: ubuntu-24.04
            label: '2/3'
            args: '--shard 2/3'
          - os: ubuntu-24.04
            label: '3/3'
            args: '--shard 3/3'
          - os: ubuntu-24.04-arm
            label: '1/3'
            args: '--shard 1/3'
          - os: ubuntu-24.04-arm
            label: '2/3'
            args: '--shard 2/3'
          - os: ubuntu-24.04-arm
            label: '3/3'
            args: '--shard 3/3'
          - os: macos-15
            label: 'platform-runtime'
            args: '--pkg state --pkg agent-pi --pkg cli --pkg core --pkg decisions --pkg memory'
          - os: macos-15
            label: 'platform-turnkey-1'
            args: '--pkg github-app --shard 1/2'
          - os: macos-15
            label: 'platform-turnkey-2'
            args: '--pkg github-app --shard 2/2'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Build and compile tests
        run: npm run build && ./node_modules/.bin/tsc -p tsconfig.test.json
      - name: Install Python bridge dependencies (Linux)
        if: runner.os == 'Linux'
        env:
          TEST_ARGS: ${{ matrix.args }}
        run: |
          read -r -a args <<< "$TEST_ARGS"
          NEED_PYTEST=0
          if node scripts/run-tests.mjs "${args[@]}" --list | grep -q 'python-bridge\.test\.js'; then
            NEED_PYTEST=1
          fi
          if [[ "$NEED_PYTEST" -eq 1 ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-packaging python3-yaml python3-requests python3-pytest python3-pytest-xdist
          elif ! python3 -c "import packaging, yaml, requests" >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-packaging python3-yaml python3-requests
          else
            echo "System Python already has packaging/yaml/requests and shard skips pytest; skipping apt-get."
          fi
      - name: Install Python bridge runtime modules (macOS)
        if: runner.os == 'macOS' && matrix.label == 'platform-runtime'
        run: python3 -m pip install --break-system-packages --disable-pip-version-check --no-input -q packaging pyyaml requests || python3 -m pip install --user --disable-pip-version-check --no-input -q packaging pyyaml requests
      - name: Mount tmpfs scratch directory (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /mnt/lw-tmp
          sudo mount -t tmpfs -o size=3G,mode=1777,exec tmpfs /mnt/lw-tmp
          echo "TMPDIR=/mnt/lw-tmp" >> "$GITHUB_ENV"
      - name: Run unit and integration tests
        env:
          TEST_ARGS: ${{ matrix.args }}
        run: |
          mkdir -p .claude/s04-qualification
          read -r -a args <<< "$TEST_ARGS"
          node scripts/run-tests.mjs "${args[@]}"
