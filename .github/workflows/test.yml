name: Test

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "v*-dev"
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.png"
      - "**.svg"
  pull_request:
    branches:
      - main
      - "v*-dev"
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.png"
      - "**.svg"

jobs:
  unit:
    name: unit (${{ matrix.os }}, ${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: '1/3'
            args: '--shard 1/3'
          - os: ubuntu-24.04
            label: '2/3'
            args: '--shard 2/3'
          - os: ubuntu-24.04
            label: '3/3'
            args: '--shard 3/3'
          - os: ubuntu-24.04-arm
            label: '1/3'
            args: '--shard 1/3'
          - os: ubuntu-24.04-arm
            label: '2/3'
            args: '--shard 2/3'
          - os: ubuntu-24.04-arm
            label: '3/3'
            args: '--shard 3/3'
          - os: macos-15
            label: 'platform-runtime'
            args: '--pkg agent-pi --pkg cli --pkg core --pkg decisions --pkg memory'
          - os: macos-15
            label: 'platform-turnkey'
            args: '--pkg github-app'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Build and compile tests
        run: npm run build && ./node_modules/.bin/tsc -p tsconfig.test.json
      - name: Install Python bridge dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          if node scripts/run-tests.mjs ${{ matrix.args }} --list | grep -q '/taskpack-runner/'; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-packaging python3-yaml python3-requests python3-pytest python3-pytest-xdist
          else
            echo "Shard does not include taskpack-runner; skipping apt-get Python setup."
          fi
      - name: Run unit and integration tests
        run: mkdir -p .claude/s04-qualification && node scripts/run-tests.mjs ${{ matrix.args }}
