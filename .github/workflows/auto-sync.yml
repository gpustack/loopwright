name: Auto Sync

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

concurrency:
  group: "${{ github.workflow }}-${{ github.repository }}"
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      runner_profile:
        description: "Runner profile ('normal', '4x', or '8x')"
        default: normal
        required: false
        type: choice
        options:
          - normal
          - 4x
          - 8x
      dry-run:
        description: "Compile without invoking model execution or PR publication"
        default: false
        required: false
        type: boolean
      force:
        description: "Force candidate mode even when preflight detects no upstream changes"
        default: false
        required: false
        type: boolean
  issue_comment:
    types:
      - created

jobs:
  auto-sync:
    name: Auto Sync
    # Bot check checks both user.type and the [bot] login suffix to mirror evaluateCommentPayload in packages/github-app.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'schedule' && github.repository == 'gpustack/loopwright')
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && github.event.issue.state == 'open'
        && github.event.comment.user.type != 'Bot'
        && !endsWith(github.event.comment.user.login, '[bot]')
        && startsWith(github.event.comment.body, '/auto-sync')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ${{ inputs.runner_profile && inputs.runner_profile != 'normal' && format('ubuntu-24.04-{0}', inputs.runner_profile) || vars.AUTOSYNC_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      npm_config_ignore_scripts: 'true'
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify main ref
        id: main_ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_REF}" != "refs/heads/main" ]]; then
            echo "Refusing workflow_dispatch from '${DISPATCH_REF}'; dispatch Auto Sync from refs/heads/main." >&2
            exit 1
          fi
          MAIN_SHA="$(git rev-parse --verify 'HEAD^{commit}')"
          echo "sha=${MAIN_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Fetch PR head
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_MAIN_SHA: ${{ steps.main_ref.outputs.sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [[ ! "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid pull request number '${PR_NUMBER}' in issue_comment payload." >&2
            exit 1
          fi
          if [[ -n "${GH_TOKEN}" ]]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\r\n')"
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}" \
            git -c core.hooksPath=/dev/null fetch --no-tags --no-recurse-submodules origin \
              "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr/${PR_NUMBER}"
          else
            git -c core.hooksPath=/dev/null fetch --no-tags --no-recurse-submodules origin \
              "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr/${PR_NUMBER}"
          fi
          CURRENT_HEAD="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ "${CURRENT_HEAD}" != "${EXPECTED_MAIN_SHA}" ]]; then
            echo "HEAD moved unexpectedly from '${EXPECTED_MAIN_SHA}' to '${CURRENT_HEAD}'." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Working tree became dirty after pull request object fetch." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef4033f # v3.0.0
        with:
          hugo-version: '0.152.2'
          extended: true

      # Required by verify.sh runtime gates (packages/taskpack-runner python-bridge tests).
      - name: Install Python dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            python3-packaging \
            python3-yaml \
            python3-requests \
            python3-pytest \
            python3-pytest-xdist

      - name: Build workspace
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Run Loopwright
        id: loopwright
        env:
          GITHUB_SHA: ${{ steps.main_ref.outputs.sha }}
          GITHUB_REF: refs/heads/main
          INPUT_TASKPACK-PATH: .auto-sync/taskpack.yaml
          INPUT_MODE: auto
          INPUT_ALLOW-PRIVILEGED-EXECUTION: 'true'
          INPUT_EVENT-NAME: ${{ github.event_name }}
          INPUT_EVENT-PATH: ${{ github.event_path }}
          INPUT_RUN-ROOT: ${{ runner.temp }}/loopwright-auto-sync
          INPUT_RUN-ID: auto-sync-${{ github.run_id }}-${{ github.run_attempt }}
          INPUT_STORAGE-PROFILE: actions-basic
          INPUT_DRY-RUN: ${{ inputs.dry-run && 'true' || 'false' }}
          INPUT_FORCE: ${{ inputs.force && 'true' || 'false' }}
          INPUT_GITHUB-APP-ID: ${{ secrets.CI_GPUSTACK_LOOPWRIGHT_APP_ID || vars.CI_GPUSTACK_LOOPWRIGHT_APP_ID || secrets.LOOPWRIGHT_APP_ID }}
          INPUT_GITHUB-APP-PRIVATE-KEY: ${{ secrets.CI_GPUSTACK_LOOPWRIGHT_APP_PRIVATE_KEY || secrets.LOOPWRIGHT_APP_PRIVATE_KEY }}
          INPUT_OUTPUT: json,github-step-summary
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOPWRIGHT_PROVIDER_TOKEN: ${{ secrets.CI_GPUSTACK_LOOPWRIGHT_LLM_AUTH_TOKEN || secrets.CI_GPUSTACK_CODEREVIEW_LLM_AUTH_TOKEN }}
          SELF_UPGRADE_FORCE: ${{ inputs.force && 'true' || 'false' }}
          SELF_UPGRADE_RUN_ROOT: ${{ runner.temp }}/loopwright-auto-sync
          SELF_UPGRADE_REQUIRE_HUGO: '1'
        run: |
          node "${GITHUB_WORKSPACE}/packages/github-app/dist/action.js"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auto-sync-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/loopwright-auto-sync/*/run.json
            ${{ runner.temp }}/loopwright-auto-sync/*/memory-publication.json
            ${{ runner.temp }}/loopwright-auto-sync/*/artifacts/**/*.json
            ${{ runner.temp }}/loopwright-auto-sync/lw-action-*/config/config.yaml
            ${{ runner.temp }}/loopwright-auto-sync/lw-action-*/registry/registry.yaml
            !${{ runner.temp }}/loopwright-auto-sync/**/secrets.json
            !${{ runner.temp }}/loopwright-auto-sync/**/*.sqlite*
          retention-days: 30
          if-no-files-found: ignore
