apiVersion: loopwright.dev/v1alpha1
kind: Taskpack
metadata:
  name: self-upgrade
spec:
  goal:
    candidate: >-
      Upgrade Loopwright runtime dependencies (@earendil-works/pi-* in lockstep and direct yaml packages uniformly)
      using the host-staged target versions and lockfile, adapt TypeScript call sites and documentation within
      writable scope, update .auto-sync/proposal.json, and pass all verification gates.
    noChange: >-
      Verify that .auto-sync/proposal.json, workspace package manifests, and package-lock.json already match
      eligible upstream releases with zero repository modifications.
  execution:
    mode: strict
    capabilities:
      allowHostPath: true
      allowCheckNetwork: true
    digests:
      pinDigests: true
  preflight:
    script: scripts/prepare-self-upgrade.mjs
    timeoutSeconds: 600
    env:
      - SELF_UPGRADE_FORCE
      - SELF_UPGRADE_REQUESTED_MODE
      - SELF_UPGRADE_REGISTRY_FIXTURES
      - SELF_UPGRADE_LOCKFILE_FIXTURE
      - SELF_UPGRADE_SKIP_STAGE
  scope:
    writable:
      - .auto-sync/proposal.json
      - package-lock.json
      - packages/agent-pi/**
      - packages/cli/**
      - packages/controller/**
      - packages/decisions/**
      - packages/github-app/**
      - docs/**
    protected:
      - packages/agent-pi/qualification/**
      - packages/controller/qualification/**
      - packages/cli/src/closure.ts
      - packages/cli/src/failure-matrix.ts
      - docs/contribute/**
      - scripts/**
  instructions:
    - .auto-sync/instructions.md
  upstreams:
    - id: pi-coding-agent
      kind: http-json
      source: https://registry.npmjs.org/@earendil-works/pi-coding-agent/latest
      watchedPaths:
        - packages/agent-pi/package.json
      allowPrerelease: false
      versionPath: version
      monotonicSemver: true
    - id: pi-ai
      kind: http-json
      source: https://registry.npmjs.org/@earendil-works/pi-ai/latest
      watchedPaths:
        - packages/agent-pi/package.json
      allowPrerelease: false
      versionPath: version
      monotonicSemver: true
    - id: pi-agent-core
      kind: http-json
      source: https://registry.npmjs.org/@earendil-works/pi-agent-core/latest
      watchedPaths:
        - packages/agent-pi/package.json
      allowPrerelease: false
      versionPath: version
      monotonicSemver: true
    - id: pi-mcp
      kind: http-json
      source: https://registry.npmjs.org/@earendil-works/pi-mcp/latest
      watchedPaths:
        - packages/agent-pi/package.json
      allowPrerelease: false
      versionPath: version
      monotonicSemver: true
    - id: pi-codemode
      kind: http-json
      source: https://registry.npmjs.org/@earendil-works/pi-codemode/latest
      watchedPaths:
        - packages/agent-pi/package.json
      allowPrerelease: false
      versionPath: version
      monotonicSemver: true
    - id: pi-tui
      kind: http-json
      source: https://registry.npmjs.org/@earendil-works/pi-tui/latest
      watchedPaths:
        - packages/agent-pi/package.json
      allowPrerelease: false
      versionPath: version
      monotonicSemver: true
    - id: yaml
      kind: http-json
      source: https://registry.npmjs.org/yaml/latest
      watchedPaths:
        - packages/cli/package.json
        - packages/controller/package.json
        - packages/decisions/package.json
        - packages/github-app/package.json
      allowPrerelease: false
      versionPath: version
      monotonicSemver: true
  upstreamGroups:
    - id: pi-family
      policy: lockstep
      members:
        - pi-coding-agent
        - pi-ai
        - pi-agent-core
        - pi-mcp
        - pi-codemode
        - pi-tui
  proposal:
    path: .auto-sync/proposal.json
    requiredFields:
      - schema_version
      - summary
      - upstreams
      - packages
    schemaVersion: 1
  verification:
    localChecks:
      - id: proposal-ledger
        implementation: json-artifact.v1
      - id: writable-scope
        implementation: scope.v1
      - id: self-upgrade-verify
        implementation: command.v1
        parameters:
          script: .auto-sync/checks/verify.sh
          timeoutSeconds: 900
          allowReadOnlyGitHubToken: false
          toolchainPaths:
            - /usr/local/bin
            - /usr/bin
          env:
            - GITHUB_ACTIONS
            - SELF_UPGRADE_RUN_ROOT
            - SELF_UPGRADE_REQUIRE_HUGO
            - SELF_UPGRADE_ALLOW_TEST_FIXTURE
            - SELF_UPGRADE_TEST_NODE_MODULES
    externalGates: []
  publication:
    mode: pull_request
    targetBranch: main
    headBranchPrefix: auto-sync/
    titleTemplate: "chore(deps): self-upgrade runtime dependencies"
  memory:
    directory: .auto-sync/memory/self-upgrade
    apply: separate-pull-request
    onNoModelBudget: deterministic-observations-only
  triggers:
    schedule: true
    workflowDispatch: true
    releasePublished: false
    commentCommands:
      - retry
      - revise
    commentPrefixes:
      - /auto-sync
  models:
    - provider: zai-coding-cn
      id: glm-5.3
      thinking: low
      apiKeyEnv: LOOPWRIGHT_PROVIDER_TOKEN
      contextWindow: 1000000
      maxTokens: 65536
      samplingParams:
        temperature: 0.4
        top_p: 0.9
  limits:
    wallTimeSeconds: 2700
    contextWindow: 1000000
    maxOutputTokens: 65536
    commandTimeoutSeconds: 900
    toolTimeoutSeconds: 300
    maxAttempts: 3
  output:
    formats:
      - json
      - github-step-summary
